services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    platform: linux/amd64
    entrypoint: ["/app/backend-entrypoint.sh"]
    command: gunicorn --chdir backend --bind 0.0.0.0:8000 --workers 4 --threads 4 HexTick.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://web:8000
